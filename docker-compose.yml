services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ingestor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ingestor}
      POSTGRES_DB: ${POSTGRES_DB:-sensors}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Runs once, on first start of an empty volume. `make reset-db` re-runs it.
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  ingestor:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ingestor}:${POSTGRES_PASSWORD:-ingestor}@db:5432/${POSTGRES_DB:-sensors}
    volumes:
      - ./data/input:/data/input:ro
      - ./config:/app/config:ro
    # Not started by `docker compose up`; run on demand with `make ingest`.
    profiles: ["job"]

volumes:
  pgdata:
